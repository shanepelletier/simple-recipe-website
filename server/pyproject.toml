[project]
name = "simple-recipe-website"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shane Pelletier", email = "hello@shanepelletier.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.4",
]

[tool.uv]
package = false

# Quarantines newly published versions from resolution. The compromise-a-
# package attack depends on the bad release being installed in the hours
# before anyone notices and yanks it, and nothing here is urgent enough to
# want that release the day it lands.
#
# A fixed date rather than the rolling `"7 days"` form, which is unusable in a
# repo whose own tooling is recent: ruff and semgrep were both published
# inside a rolling week, so the window excluded the versions uv.lock already
# pinned and every `uv run` failed to resolve. A date only ever moves when
# someone moves it, which also makes adding a dependency a deliberate act —
# bump this line to today, and you have consciously decided the package you
# are adding is old enough to trust. Only affects resolution; `uv sync
# --frozen` in the Dockerfile installs what the lockfile already pins.
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "django-erd-generator>=0.1.7",
    "django-stubs>=6.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
    "semgrep>=1.173.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["config"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "config"
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
