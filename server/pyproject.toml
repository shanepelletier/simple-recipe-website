[project]
name = "simple-recipe-website"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shane Pelletier", email = "hello@shanepelletier.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-erd-generator>=0.1.7",
    "django-stubs>=6.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["config"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
mypy_path = "config"
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
