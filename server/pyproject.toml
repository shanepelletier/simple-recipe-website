[project]
name = "simple-recipe-website"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Shane Pelletier", email = "hello@shanepelletier.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["config"]
python_files = ["test_*.py"]
