server {
    listen 80;
    server_name _;

    # Photos are capped at MAX_UPLOAD_BYTES (5 MB) by the API's own validator.
    # This ceiling is deliberately higher: an oversized upload should reach
    # Django and come back as the field error the form knows how to render,
    # not as nginx's bare 413 HTML page that the client can't parse.
    client_max_body_size 10m;

    # Uploaded photos and the admin's own CSS come straight off the shared
    # volumes. This is the half of the split that Django's dev server only
    # does as a favour when DEBUG is on — serving them here is what lets the
    # container run with DEBUG=false without the admin losing its styling.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    # Everything the application answers. Same origin as the client above it,
    # which is the entire reason there is no CORS package on the server: the
    # browser only ever talks to this one port, exactly as it only ever talks
    # to Vite's port in development.
    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://app:8000;

        # $http_host rather than $host: it keeps the port, so Django's CSRF
        # origin check compares the browser's "Origin: http://localhost:8080"
        # against the same host:port and matches. With $host the port is
        # dropped, the comparison fails, and every write 403s with a message
        # about the referrer that sends you looking in the wrong place.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;

        # React Router owns the path space: /recipes/5 is a real URL to the
        # application but not a file on disk, so anything that isn't an asset
        # has to come back as index.html and let the client resolve it. Without
        # this line the app works until someone reloads a page or follows a
        # shared link, which is the worst possible way to find out.
        try_files $uri /index.html;
    }
}
